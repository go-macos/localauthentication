name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darwin:
    name: darwin (real LocalAuthentication, no prompt, CGO=0)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      # The darwin tests message a REAL LAContext and run a REAL Objective-C
      # block, and cannot raise a prompt: every evaluation they perform is
      # either on an invalidated context or under interactionNotAllowed, both
      # of which Apple documents as failing INSTEAD of showing UI. The one test
      # that does prompt is gated behind LOCALAUTH_LIVE_PROMPT, which is not set
      # here — CI has no finger to offer.
      - name: Test (CGO=0, real framework, prompt-free)
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1
      - name: Coverage must be 100%
        run: |
          pct=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}')
          echo "total coverage: $pct"
          [ "$pct" = "100.0%" ] || { echo "coverage regressed below 100%"; exit 1; }
      - name: Race
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  linux:
    name: linux (stub build + portable tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test (stub + portable logic)
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - name: Coverage must be 100%
        run: |
          pct=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}')
          echo "total coverage: $pct"
          [ "$pct" = "100.0%" ] || { echo "coverage regressed below 100%"; exit 1; }
      - name: Race (portable logic)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  windows:
    name: windows (stub build + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Build stub
        run: go build ./...
        env:
          CGO_ENABLED: '0'
      - name: Test (stub + portable logic)
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: '0'

  crossbuild:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS targets: the real purego backend must compile on both.
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          # The six 64-bit pure-Go targets build the non-darwin stub.
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: s390x }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Cross-compile (CGO=0)
        run: go build ./...
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
